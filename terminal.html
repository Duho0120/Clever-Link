<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="xterm.min.css">
<script src="xterm.min.js"></script>
<script src="addon-fit.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  body { font-family: 'Malgun Gothic', sans-serif; }
  #terminalHeader { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: #2a2a2a; box-sizing: border-box; }
  #terminalTitle { color: #ccc; }
  #reconnectBtn { display: inline-block; background: #7d4a2d; color: white; padding: 6px 12px; border-radius: 4px; border: none; cursor: pointer; }
  #terminalContainer { height: calc(100% - 40px); padding: 4px; box-sizing: border-box; }
</style>
</head>
<body>

<div id="terminalHeader">
  <span id="terminalTitle">터미널</span>
  <button id="reconnectBtn" onclick="reconnectTerminal()">재접속</button>
</div>
<div id="terminalContainer"></div>

<script>
// ⚠ F-5: 터미널을 메인 창의 <div> 패널이 아니라 별도 pywebview 창으로 분리.
// URL 쿼리스트링(?profile=이름)으로 전달하는 방식은 file:// URL에서 WebView2가
// 파일을 못 찾는 것으로 처리해버려서(ERR_FILE_NOT_FOUND) 실패했음. 대신 이 창 전용
// js_api(TerminalApi)가 들고 있는 프로파일 이름을 pywebviewready 이후에 물어본다.
let profileName = '';

let term = null;
let fitAddon = null;
let ws = null;
let _wsGeneration = 0;

function initTerminal() {
    term = new Terminal({
        cursorBlink: true,
        fontSize: 14,
        theme: { background: '#000000' },
    });
    fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    term.open(document.getElementById('terminalContainer'));
    fitAddon.fit();

    // 사용자가 키보드 입력 시 -> 서버로 전송
    term.onData(data => {
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: 'input', data: data }));
        }
    });

    // ⚠ 창 크기 변경 시 -> 서버에 resize 알림 (vim/htop 화면 깨짐 방지)
    term.onResize(({ cols, rows }) => {
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: 'resize', cols: cols, rows: rows }));
        }
    });

    // 별도 창이라 창 자체 크기 변경에 맞춰 터미널도 다시 맞춰야 함
    window.addEventListener('resize', () => fitAddon.fit());

    // ⚠ 복사/붙여넣기: xterm.js는 기본적으로 클립보드 연동이 없다.
    // navigator.clipboard.*는 WebView2에 권한 프롬프트 UI가 없어서 조용히 막히는
    // 경우가 많아 안 쓴다. 복사는 브라우저 네이티브 copy 이벤트(clipboardData)로 처리.
    // Ctrl+V는 (아래 attachCustomKeyEventHandler에서) 브라우저 네이티브 paste + xterm
    // 자체 내장 처리에 맡긴다. 우클릭 붙여넣기는 네이티브 paste 이벤트가 안 뜨는
    // 경로라 이미 떠 있는 tkinter 창의 클립보드를 파이썬 쪽(get_clipboard_text)에서
    // 대신 읽어오는 방식으로 우회한다.

    async function pasteFromClipboard() {
        const text = await window.pywebview.api.get_clipboard_text();
        if (text) term.paste(text);
    }

    term.attachCustomKeyEventHandler((e) => {
        if (e.type !== 'keydown') return true;

        // Ctrl+C: 선택된 텍스트가 있으면 복사, 없으면 xterm 기본 동작(SIGINT 전달)을 그대로 둔다.
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'c' && term.hasSelection()) {
            document.execCommand('copy');
            e.preventDefault();  // 우리가 이 키를 완전히 책임진다는 뜻으로, 브라우저 기본 동작도 확실히 막는다
            return false;
        }

        // ⚠ Ctrl+V: xterm이 이 키를 처리하지 않게(return false) 막으면, xterm 자체의
        // "^V로 변환해서 보내기" 동작만 없어질 뿐 브라우저 네이티브 paste 동작은 그대로
        // 살아있다. 그 네이티브 paste가 xterm 내부 textarea에 떨어지면 xterm이 자체
        // 등록해둔 paste 리스너가 알아서 처리해준다 — 그래서 여기선 직접 개입하지 않고
        // xterm 기본 처리에 맡긴다(우리가 클립보드를 따로 읽어와 term.paste()까지 호출하면
        // 네이티브 paste와 겹쳐서 두 번 붙여넣기 되는 버그가 있었음).
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'v') {
            return false;
        }

        // ⚠ Shift+방향키 (Ctrl 같이 눌렸든 아니든): GUI 텍스트 에디터의 "선택 영역
        // 넓히기" 단축키라 xterm.js/SSH 셸에서는 지원되지 않는다. 그대로 두면 셸이
        // 못 알아듣는 modifier 붙은 이스케이프 시퀀스(예: Shift+→ = \x1b[1;2C,
        // Ctrl+Shift+→ = \x1b[1;6C)를 그대로 화면에 찍어버려서 "이상한 문구"로
        // 보인다(처음엔 Ctrl+Shift 조합만 처리했는데, Shift만 눌러도 똑같이 깨져서
        // Shift가 들어간 모든 방향키 조합으로 범위를 넓힘). cmd.exe도 이 조합에서는
        // 그냥 커서만 움직이므로 그것과 동일하게 modifier 없는 방향키로 흘려보낸다.
        // ⚠ preventDefault를 반드시 호출해야 한다 — 안 그러면 xterm 처리는 막히지만
        // 브라우저 기본 동작(textarea 안에서 선택영역 넓히기)이 남아있게 되어 우리가
        // 보낸 것과 겹쳐 이상하게 보일 수 있다.
        const PLAIN_ARROW = { ArrowLeft: '\x1b[D', ArrowRight: '\x1b[C', ArrowUp: '\x1b[A', ArrowDown: '\x1b[B' };
        if (e.shiftKey && PLAIN_ARROW[e.key]) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'input', data: PLAIN_ARROW[e.key] }));
            }
            e.preventDefault();
            return false;
        }

        return true;
    });

    document.addEventListener('copy', (e) => {
        if (!term.hasSelection()) return;
        e.preventDefault();
        e.clipboardData.setData('text/plain', term.getSelection());
    });

    // 오른쪽 클릭 = 붙여넣기 (터미널 앱에서 흔한 관례). Ctrl+V와 같은 경로를 탄다.
    document.getElementById('terminalContainer').addEventListener('contextmenu', (e) => {
        e.preventDefault();
        pasteFromClipboard();
    });

    connectWebSocket();
}

function connectWebSocket() {
    const generation = ++_wsGeneration;
    // ⚠ 이전 연결이 남아있으면 반드시 먼저 닫는다 (세션이 섞이는 버그 방지, F-6 참고)
    if (ws) {
        ws.onmessage = null;
        ws.onerror = null;
        ws.onclose = null;
        ws.close();
    }

    ws = new WebSocket('ws://localhost:8765');

    ws.onopen = () => {
        if (generation !== _wsGeneration) return;
        ws.send(JSON.stringify({ type: 'init', profile: profileName }));
        fitAddon.fit();
        ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
    };

    ws.onmessage = (event) => {
        if (generation !== _wsGeneration) return;
        const msg = JSON.parse(event.data);
        if (msg.type === 'connected') {
            onConnectionAlive();
            term.write('\r\n[연결 완료]\r\n');
        } else if (msg.type === 'output') {
            term.write(msg.data);
            onConnectionAlive();
        } else if (msg.type === 'error') {
            term.write(`\r\n[오류] ${msg.message}\r\n`);
            handleDisconnected();
        } else if (msg.type === 'closed') {
            term.write('\r\n[연결 끊김]\r\n');
            handleDisconnected();
        }
    };

    ws.onerror = () => {
        if (generation !== _wsGeneration) return;
        handleDisconnected();
    };
}

// ⚠ 2026-08-11 추가 — 젯슨이 IP를 바꾸면 한동안(수십 초) 네트워크 응답 자체를 안 해서,
// 그 사이에 재접속을 눌러봐야 무조건 실패한다(실측 확인: 스캔은 대역의 다른 장비 50여 개를
// 정상 응답받는데 대상 MAC만 안 잡힘). 스캔을 더 빠르게 만드는 건 물리적으로 불가능하므로,
// 대신 사용자가 버튼을 계속 누르지 않아도 되도록 백그라운드에서 자동으로 재시도하다가
// 장비가 돌아오는 순간 스스로 붙게 한다.
// ⚠ 2026-08-11 실사용 측정 후 단축 — 예전엔 10초/15초부터 시작했는데, 재시도 "시도" 자체가
// 이미 15초쯤 걸린다(초기 접속 5초 + 같은 주소 재시도 4초 + MAC 스캔). 그 위에 대기까지
// 길게 잡으니 전체 복구가 60초 가까이 걸렸다. 시도 자체가 충분히 긴 간격 역할을 하므로
// 앞쪽 대기를 줄이고, 계속 실패하면 그때부터 간격을 벌린다.
const AUTO_RETRY_DELAYS_MS = [5000, 5000, 5000, 5000, 5000, 5000, 5000, 5000, 5000, 5000];
let _autoRetryTimer = null;
let _autoRetryIndex = 0;

function handleDisconnected() {
    if (_autoRetryIndex === 0 && !_autoRetryTimer) {
        _autoRetryIndex = 1;
        term.write('\r\n[자동 재접속] 첫 번째 재접속을 바로 시도합니다...\r\n');
        reconnectTerminal({ auto: true });
        return;
    }
    document.getElementById('reconnectBtn').style.display = 'inline-block';
    scheduleAutoRetry();
}

function scheduleAutoRetry() {
    if (_autoRetryTimer) return;  // 이미 예약돼 있으면 중복 예약 안 함
    if (_autoRetryIndex >= AUTO_RETRY_DELAYS_MS.length) {
        term.write('\r\n[자동 재시도 중단] 재접속 버튼으로 직접 다시 시도해주세요.\r\n');
        return;
    }
    const delay = AUTO_RETRY_DELAYS_MS[_autoRetryIndex];
    _autoRetryIndex += 1;
    term.write(`\r\n[자동 재시도] ${Math.round(delay / 1000)}초 후 다시 연결을 시도합니다... `
        + `(${_autoRetryIndex}/${AUTO_RETRY_DELAYS_MS.length}, 지금 바로 하려면 재접속 버튼)\r\n`);
    _autoRetryTimer = setTimeout(() => {
        _autoRetryTimer = null;
        reconnectTerminal({ auto: true });
    }, delay);
}

function cancelAutoRetry() {
    if (_autoRetryTimer) {
        clearTimeout(_autoRetryTimer);
        _autoRetryTimer = null;
    }
}

function notifyTerminalClosing() {
    cancelAutoRetry();
    _wsGeneration += 1;
    if (ws) {
        ws.onmessage = null;
        ws.onerror = null;
        ws.onclose = null;
        try { ws.close(); } catch (e) {}
        ws = null;
    }
    try {
        if (window.pywebview && window.pywebview.api && window.pywebview.api.cancel_profile_connect) {
            window.pywebview.api.cancel_profile_connect();
        }
    } catch (e) {}
}

// 연결이 실제로 살아난 게 확인되면(출력이 한 번이라도 오면) 재시도 카운터를 초기화한다.
function onConnectionAlive() {
    cancelAutoRetry();
    _autoRetryIndex = 0;
}

function reconnectTerminal(opts) {
    cancelAutoRetry();
    if (!opts || !opts.auto) {
        _autoRetryIndex = 0;  // 사용자가 직접 누른 거면 재시도 횟수를 처음부터 다시 센다
    }
    term.write('\r\n[재접속 중...]\r\n');
    connectWebSocket();
}

async function init() {
    profileName = await window.pywebview.api.get_profile_name();
    document.getElementById('terminalTitle').innerText = `터미널 - ${profileName}`;
    document.title = `터미널 - ${profileName}`;
    initTerminal();
}

window.addEventListener('beforeunload', notifyTerminalClosing);
window.addEventListener('pagehide', notifyTerminalClosing);

window.addEventListener('pywebviewready', init);
</script>

</body>
</html>
